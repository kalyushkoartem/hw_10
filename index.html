<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="container">
    <h1>Завдання з таймерами</h1>

    <section>
      <h2>Завдання 1 Таймер інтервалу</h2>
      <button id="startTimer">Запустити таймер</button>
      <p id="timerText">Очікуемо</p>
    </section>


    <section>
      <h2>Завдання 2 Анімація</h2>
      <button id="startAnimation">Запустити анімацію</button>
      <div id="box"></div>
    </section>


    <section>
      <h2>Завдання 3 Інтерактивна гра</h2>
      <p>Очки: <span id="score">0</span></p>
      <button id="startGame">Почати гру</button>

      <div id="gameArea">
        <div id="target"></div>
      </div>
    </section>


    <section>
      <h2>Завдання 4 Контроль часу</h2>

      <input
        type="number"
        id="seconds"
        placeholder="Введіть секунди"
      >

      <button id="startCountdown">Запустити</button>

      <p id="countdownText"></p>
    </section>
  </div>

<script type="module" src="./js/script.js"></script>
</body>
</html>
